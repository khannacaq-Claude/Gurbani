<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurbani Fashion - Shop Online v8.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #C06090;
            --secondary: #8B4B7A;
            --accent: #E8B4D0;
            --dark: #333;
            --light: #666;
            --bg-light: #F9F7FB;
            --bg-white: #FFFFFF;
            --border: #E0E0E0;
            --success: #4CAF50;
            --danger: #F44336;
            --warning: #FF9800;
            --info: #2196F3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            border-bottom: 2px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-text h1 {
            color: var(--primary);
            font-size: 18px;
        }

        .logo-text p {
            color: var(--light);
            font-size: 11px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-box {
            display: flex;
            gap: 5px;
            background: var(--bg-light);
            padding: 8px 12px;
            border-radius: 5px;
            align-items: center;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 150px;
            font-size: 14px;
        }

        .user-menu {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary-small {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(192, 96, 144, 0.2);
        }

        .btn-outline-small {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline-small:hover {
            background: var(--primary);
            color: white;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 20px;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* ===== MAIN CONTENT ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 50px 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* ===== FILTERS ===== */
        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
        }

        /* ===== FABRIC GRID ===== */
        .fabrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .fabric-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s;
            cursor: pointer;
        }

        .fabric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(192, 96, 144, 0.15);
        }

        .fabric-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            position: relative;
        }

        .favorite-star {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            border: none;
        }

        .favorite-star:hover {
            transform: scale(1.1);
            background: white;
        }

        .favorite-star.active {
            color: var(--danger);
        }

        .fabric-info {
            padding: 15px;
        }

        .fabric-name {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 16px;
        }

        .fabric-details {
            color: var(--light);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .fabric-price {
            color: var(--primary);
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .fabric-stock {
            color: var(--light);
            font-size: 12px;
            margin-top: 8px;
        }

        .btn-view {
            width: 100%;
            padding: 10px;
            background: var(--bg-light);
            border: none;
            color: var(--primary);
            cursor: pointer;
            border-radius: 5px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-view:hover {
            background: var(--primary);
            color: white;
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(192, 96, 144, 0.2);
        }

        .btn-large {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary-large {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(192, 96, 144, 0.3);
        }

        .error-message {
            background: #FFEBEE;
            color: var(--danger);
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .success-message {
            background: #E8F5E9;
            color: var(--success);
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .search-box input {
                width: 100px;
            }

            .hero {
                padding: 30px 15px;
            }

            .hero h2 {
                font-size: 24px;
            }

            .fabrics-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .fabric-image {
                height: 150px;
                font-size: 12px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
            }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--light);
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo-section">
            <div class="logo">👗</div>
            <div class="logo-text">
                <h1>Gurbani Fashion</h1>
                <p>Passion For Fashion</p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search fabrics...">
            <button onclick="filterFabrics()" style="background: none; border: none; cursor: pointer; font-size: 16px;">🔍</button>
        </div>

        <div class="user-menu">
            <div class="cart-icon" onclick="openCart()">
                🛒
                <span class="cart-count" id="cartCount" style="display: none;">0</span>
            </div>
            <button class="btn-small btn-outline-small" id="authBtn" onclick="toggleAuth()">Login</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">
        <!-- HERO -->
        <div class="hero">
            <h2>Discover Our Beautiful Collection</h2>
            <p>Handcrafted fabrics and designs for every occasion</p>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <div class="filter-group">
                <label>Category</label>
                <select id="categoryFilter" onchange="filterFabrics()">
                    <option value="">All Categories</option>
                    <option value="silk">Silk</option>
                    <option value="cotton">Cotton</option>
                    <option value="blend">Blend</option>
                    <option value="georgette">Georgette</option>
                    <option value="chiffon">Chiffon</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Color</label>
                <input type="text" id="colorFilter" placeholder="e.g., Red, Blue" onchange="filterFabrics()">
            </div>

            <div class="filter-group">
                <label>Price Range (₹)</label>
                <select id="priceFilter" onchange="filterFabrics()">
                    <option value="">All Prices</option>
                    <option value="0-500">₹0 - ₹500</option>
                    <option value="500-1000">₹500 - ₹1000</option>
                    <option value="1000-2000">₹1000 - ₹2000</option>
                    <option value="2000">₹2000+</option>
                </select>
            </div>
        </div>

        <!-- FABRICS GRID -->
        <div id="fabricsContainer" class="fabrics-grid"></div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Login / Sign Up</h2>
                <button class="close-btn" onclick="closeModal('loginModal')">×</button>
            </div>

            <div id="loginError" class="error-message"></div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>

                <button class="btn-large btn-primary-large" onclick="login()">Login</button>

                <p style="text-align: center; margin-top: 15px; color: var(--light);">
                    New customer? <a href="#" onclick="toggleSignup()" style="color: var(--primary); text-decoration: none;">Sign up here</a>
                </p>
            </div>

            <div id="signupForm" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Your Name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="signupPhone" placeholder="9876543210">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••">
                </div>

                <button class="btn-large btn-primary-large" onclick="signup()">Create Account</button>

                <p style="text-align: center; margin-top: 15px; color: var(--light);">
                    Already have account? <a href="#" onclick="toggleSignup()" style="color: var(--primary); text-decoration: none;">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- FABRIC DETAILS MODAL -->
    <div id="fabricModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="fabricTitle">Fabric Details</h2>
                <button class="close-btn" onclick="closeModal('fabricModal')">×</button>
            </div>

            <div id="fabricDetails"></div>
        </div>
    </div>

    <!-- CART MODAL -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Shopping Cart</h2>
                <button class="close-btn" onclick="closeModal('cartModal')">×</button>
            </div>

            <div id="cartContent"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://gurbani-fashion-backend-production.up.railway.app';
        let authToken = localStorage.getItem('authToken');
        let userEmail = localStorage.getItem('userEmail');
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let allFabrics = [];

        // Initialize
        window.addEventListener('load', () => {
            updateAuthButton();
            loadFabrics();
            updateCartCount();
        });

        // Load Fabrics from API
        async function loadFabrics() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/customer/fabrics?limit=50`);
                if (response.ok) {
                    const data = await response.json();
                    allFabrics = data.data || [];
                    displayFabrics(allFabrics);
                } else {
                    showError('Failed to load fabrics');
                }
            } catch (error) {
                console.error('Error loading fabrics:', error);
                showError('Connection error. Please refresh the page.');
            }
        }

        // Display Fabrics
        function displayFabrics(fabrics) {
            const container = document.getElementById('fabricsContainer');

            if (fabrics.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">📦</div>
                        <h3>No fabrics found</h3>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = fabrics.map(fabric => `
                <div class="fabric-card">
                    <div class="fabric-image">
                        ${fabric.color} Fabric
                        <button class="favorite-star" onclick="toggleFavorite(event, '${fabric._id}')" title="Add to favorites">
                            ⭐
                        </button>
                    </div>
                    <div class="fabric-info">
                        <div class="fabric-name">${fabric.name}</div>
                        <div class="fabric-details">Code: ${fabric.code}</div>
                        <div class="fabric-details">Category: ${fabric.category}</div>
                        <div class="fabric-price">₹${fabric.price}/meter</div>
                        <div class="fabric-stock">Stock: ${fabric.inventory.available}m available</div>
                        <button class="btn-view" onclick="showFabricDetails('${fabric._id}')">View Details</button>
                    </div>
                </div>
            `).join('');
        }

        // Filter Fabrics
        function filterFabrics() {
            const category = document.getElementById('categoryFilter').value;
            const color = document.getElementById('colorFilter').value.toLowerCase();
            const price = document.getElementById('priceFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allFabrics.filter(fabric => {
                let matches = true;

                if (category && fabric.category !== category) matches = false;
                if (color && !fabric.color.toLowerCase().includes(color)) matches = false;
                if (search && !fabric.name.toLowerCase().includes(search)) matches = false;

                if (price) {
                    const [min, max] = price.split('-').map(p => parseInt(p));
                    if (max) {
                        if (fabric.price < min || fabric.price > max) matches = false;
                    } else {
                        if (fabric.price < min) matches = false;
                    }
                }

                return matches;
            });

            displayFabrics(filtered);
        }

        // Show Fabric Details
        function showFabricDetails(fabricId) {
            const fabric = allFabrics.find(f => f._id === fabricId);
            if (!fabric) return;

            document.getElementById('fabricTitle').textContent = fabric.name;
            document.getElementById('fabricDetails').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <p><strong>Code:</strong> ${fabric.code}</p>
                    <p><strong>Category:</strong> ${fabric.category}</p>
                    <p><strong>Color:</strong> ${fabric.color}</p>
                    <p><strong>Price:</strong> ₹${fabric.price} per meter</p>
                    <p><strong>Available:</strong> ${fabric.inventory.available} meters</p>
                </div>

                <div class="form-group">
                    <label>Quantity (in meters)</label>
                    <input type="number" id="quantityInput" min="1" max="${fabric.inventory.available}" value="1" placeholder="Enter quantity">
                </div>

                <button class="btn-large btn-primary-large" onclick="addToCart('${fabric._id}', '${fabric.name}', ${fabric.price})">
                    Add to Cart
                </button>
            `;

            openModal('fabricModal');
        }

        // Add to Cart (requires login)
        function addToCart(fabricId, name, price) {
            if (!authToken) {
                showError('Please login to add items to cart');
                setTimeout(() => openModal('loginModal'), 500);
                return;
            }

            const quantity = parseInt(document.getElementById('quantityInput').value);
            if (quantity < 1) {
                showError('Please enter valid quantity');
                return;
            }

            cart.push({
                id: fabricId,
                name,
                price,
                quantity,
                addedAt: new Date().toISOString()
            });

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            closeModal('fabricModal');
            showSuccess('Item added to cart!');
        }

        // Toggle Favorite
        async function toggleFavorite(event, fabricId) {
            event.stopPropagation();

            if (!authToken) {
                showError('Please login to add favorites');
                setTimeout(() => openModal('loginModal'), 500);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/customer/profile/favorites/${fabricId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    event.target.classList.toggle('active');
                    showSuccess('Added to favorites!');
                }
            } catch (error) {
                console.error('Error toggling favorite:', error);
                showError('Failed to add favorite');
            }
        }

        // Login
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please fill all fields', 'loginError');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    userEmail = email;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('userEmail', userEmail);
                    updateAuthButton();
                    closeModal('loginModal');
                    showSuccess('Logged in successfully!');
                } else {
                    showError(data.message || 'Login failed', 'loginError');
                }
            } catch (error) {
                showError('Connection error', 'loginError');
            }
        }

        // Signup
        async function signup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || !phone || !password) {
                showError('Please fill all fields', 'loginError');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    userEmail = email;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('userEmail', userEmail);
                    updateAuthButton();
                    closeModal('loginModal');
                    showSuccess('Account created! Welcome! 🎉');
                } else {
                    showError(data.message || 'Signup failed', 'loginError');
                }
            } catch (error) {
                showError('Connection error', 'loginError');
            }
        }

        // Logout
        function logout() {
            authToken = null;
            userEmail = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('userEmail');
            updateAuthButton();
            showSuccess('Logged out');
        }

        // Update Auth Button
        function updateAuthButton() {
            const btn = document.getElementById('authBtn');
            if (authToken) {
                btn.textContent = 'Logout';
                btn.onclick = logout;
            } else {
                btn.textContent = 'Login';
                btn.onclick = () => toggleAuth();
            }
        }

        // Cart Functions
        function updateCartCount() {
            const count = cart.length;
            const countEl = document.getElementById('cartCount');
            if (count > 0) {
                countEl.textContent = count;
                countEl.style.display = 'flex';
            } else {
                countEl.style.display = 'none';
            }
        }

        function openCart() {
            if (!authToken) {
                showError('Please login to view cart');
                setTimeout(() => openModal('loginModal'), 500);
                return;
            }

            if (cart.length === 0) {
                document.getElementById('cartContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Start adding fabrics!</p>
                    </div>
                `;
            } else {
                let total = 0;
                const cartHTML = `
                    <div>
                        ${cart.map((item, i) => {
                            const subtotal = item.price * item.quantity;
                            total += subtotal;
                            return `
                                <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>${item.name}</strong><br>
                                        <small>₹${item.price} × ${item.quantity}m = ₹${subtotal}</small>
                                    </div>
                                    <button onclick="removeFromCart(${i})" style="background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Remove</button>
                                </div>
                            `;
                        }).join('')}

                        <div style="padding: 20px; background: var(--bg-light); border-radius: 5px; margin-top: 20px;">
                            <h3 style="color: var(--dark); margin-bottom: 15px;">Order Summary</h3>
                            <p style="font-size: 18px;"><strong>Total: ₹${total}</strong></p>
                            <button class="btn-large btn-primary-large" onclick="checkout()">Proceed to Checkout</button>
                        </div>
                    </div>
                `;
                document.getElementById('cartContent').innerHTML = cartHTML;
            }

            openModal('cartModal');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            openCart();
        }

        function checkout() {
            if (!authToken) {
                showError('Please login first');
                return;
            }

            let total = 0;
            cart.forEach(item => total += item.price * item.quantity);

            showSuccess(`✅ Order placed successfully!\n\nTotal: ₹${total}\nItems: ${cart.length}\n\nThank you for your order! We'll contact you soon.`);
            
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            closeModal('cartModal');
        }

        // Modal Functions
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function toggleAuth() {
            openModal('loginModal');
        }

        function toggleSignup() {
            document.getElementById('loginForm').style.display = document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
        }

        // Notifications
        function showError(message, elementId = null) {
            if (elementId) {
                const el = document.getElementById(elementId);
                el.textContent = message;
                el.style.display = 'block';
            } else {
                alert('❌ ' + message);
            }
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        // Close modals on background click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
